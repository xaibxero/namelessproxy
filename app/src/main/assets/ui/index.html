<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Nameless</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-state="disconnected">
  <!-- GPU-Accelerated Ambient Glow Layer -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="orb orb-cyan"></div>
    <div class="orb orb-violet"></div>
  </div>

  <!-- Top Pill Header -->
  <header class="top-header jelly-el" data-squish="soft">
    <div class="brand-row">
      <span class="status-dot" id="headerDot"></span>
      <span class="brand-title">NAMELESS</span>
    </div>
    <div class="exit-badge" id="exitIpBadge">OFFLINE</div>
  </header>

  <!-- Main Viewport -->
  <main class="viewport">
    <!-- TAB 0: CONNECT -->
    <section class="tab-view active" id="tab-0">
      <div class="orb-stage">
        <button class="power-orb jelly-el" id="powerOrb" data-squish="deep" type="button" aria-label="Toggle Tunnel">
          <span class="orb-ring ring-outer"></span>
          <span class="orb-ring ring-inner"></span>
          <span class="orb-specular"></span>
          <svg class="power-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
            <path d="M12 2v10" />
            <path d="M18.4 6.6a9 9 0 1 1-12.77.04" />
          </svg>
          <span class="orb-state-text" id="orbStateText">TAP</span>
        </button>
      </div>

      <!-- Compact Speed Capsules -->
      <div class="speed-grid">
        <div class="glass-pill jelly-el" data-squish="mid">
          <span class="pill-arrow down">↓</span>
          <div class="pill-metrics">
            <span class="metric-val" id="rxSpeed">0.0 KB/s</span>
            <span class="metric-sub" id="rxTotal">0.0 MB</span>
          </div>
        </div>
        <div class="glass-pill jelly-el" data-squish="mid">
          <span class="pill-arrow up">↑</span>
          <div class="pill-metrics">
            <span class="metric-val" id="txSpeed">0.0 KB/s</span>
            <span class="metric-sub" id="txTotal">0.0 MB</span>
          </div>
        </div>
      </div>

      <!-- Quick Endpoint & Mode Toggles -->
      <div class="quick-card glass-card">
        <div class="proto-pills">
          <button type="button" class="chip-btn jelly-el active" data-proto="socks5" id="protoSocks5">SOCKS5</button>
          <button type="button" class="chip-btn jelly-el" data-proto="http" id="protoHttp">HTTP</button>
          <button type="button" class="chip-btn jelly-el" id="quickPasteBtn">PASTE</button>
        </div>
        <div class="input-grid">
          <input type="text" id="proxyHost" class="bubble-input flex-2" placeholder="Host / IP" autocomplete="off" spellcheck="false" />
          <input type="number" id="proxyPort" class="bubble-input flex-1" placeholder="Port" autocomplete="off" />
        </div>
        <div class="input-grid">
          <input type="text" id="proxyUser" class="bubble-input flex-1" placeholder="User" autocomplete="off" spellcheck="false" />
          <input type="password" id="proxyPass" class="bubble-input flex-1" placeholder="Pass" autocomplete="off" />
        </div>
        <div class="toggle-strip">
          <button type="button" class="toggle-pill jelly-el" id="hotspotBtn" data-squish="mid">
            <span class="toggle-dot"></span>
            <span>Hotspot</span>
          </button>
          <button type="button" class="toggle-pill jelly-el active" id="killswitchBtn" data-squish="mid">
            <span class="toggle-dot"></span>
            <span>Killswitch</span>
          </button>
          <button type="button" class="toggle-pill jelly-el" id="saveProfileBtn" data-squish="mid">
            <span>+ Save</span>
          </button>
        </div>
      </div>

      <!-- Saved Profiles Horizontal Bubble Strip -->
      <div class="profiles-strip" id="profilesStrip"></div>
    </section>

    <!-- TAB 1: CHECK (AUTO LIVE EMBEDDED CHECKER) -->
    <section class="tab-view" id="tab-1">
      <div class="checker-toolbar" id="checkerToolbar">
        <button type="button" class="checker-pill jelly-el active" data-url="https://ipfighter.com" id="chkIpFighter">
          IPFighter
        </button>
        <button type="button" class="checker-pill jelly-el" data-url="https://browserleaks.com/webrtc" id="chkWebRtc">
          WebRTC
        </button>
        <button type="button" class="checker-pill jelly-el" data-url="https://browserleaks.com/dns" id="chkDns">
          DNS
        </button>
        <button type="button" class="checker-icon-btn jelly-el" id="chkReload" aria-label="Reload">
          ↻
        </button>
      </div>
      <!-- Native Hardware-Accelerated WebView mounts directly over #checkerFrameSlot -->
      <div class="checker-frame-slot" id="checkerFrameSlot"></div>
    </section>

    <!-- TAB 2: APPS (ALL APPS VS SPECIFIC APPS ROUTING) -->
    <section class="tab-view" id="tab-2">
      <div class="apps-header glass-card">
        <div class="mode-switch">
          <button type="button" class="mode-btn jelly-el active" data-mode="all" id="modeAllBtn">All Apps</button>
          <button type="button" class="mode-btn jelly-el" data-mode="whitelist" id="modeIncludeBtn">Only Selected</button>
          <button type="button" class="mode-btn jelly-el" data-mode="blacklist" id="modeExcludeBtn">Exclude</button>
        </div>
        <div class="search-row">
          <input type="text" id="appSearchInput" class="bubble-input flex-2" placeholder="Search apps..." autocomplete="off" />
          <button type="button" class="chip-btn jelly-el" id="clearAppsBtn">Clear</button>
        </div>
      </div>
      <div class="apps-list" id="appsList"></div>
    </section>
  </main>

  <!-- Floating Glass Dock -->
  <nav class="bottom-dock" id="bottomDock">
    <button type="button" class="dock-btn jelly-el active" data-tab="0">
      <span class="dock-icon">⚡</span>
      <span class="dock-label">Tunnel</span>
    </button>
    <button type="button" class="dock-btn jelly-el" data-tab="1">
      <span class="dock-icon">🛡️</span>
      <span class="dock-label">Check</span>
    </button>
    <button type="button" class="dock-btn jelly-el" data-tab="2">
      <span class="dock-icon">📦</span>
      <span class="dock-label">Apps</span>
    </button>
  </nav>

  <!-- Fast Pop-Up Toast -->
  <div class="toast-bubble" id="toastBubble"></div>

  <script src="app.js"></script>
</body>
</html>
