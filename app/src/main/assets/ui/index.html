<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nameless Proxy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-state="disconnected">
  <div class="app-shell">
    <!-- Precision Top Bar -->
    <header class="top-bar">
      <button type="button" class="net-chip" onclick="pollBackendStatus()">
        <span class="status-dot" id="headerOrb"></span>
        <span class="net-label" id="netSummaryText">Online</span>
      </button>

      <div class="slot-bar" id="slotStrip">
        <button type="button" class="slot-pill active" data-slot="0" onclick="selectSlot(0)">P1</button>
        <button type="button" class="slot-pill" data-slot="1" onclick="selectSlot(1)">P2</button>
        <button type="button" class="slot-pill" data-slot="2" onclick="selectSlot(2)">P3</button>
        <button type="button" class="slot-pill" data-slot="3" onclick="selectSlot(3)">P4</button>
        <button type="button" class="slot-pill" data-slot="4" onclick="selectSlot(4)">P5</button>
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="viewport">
      <!-- TAB 0: DASHBOARD & PROXY (DPI-INDEPENDENT, FITS SCREEN) -->
      <section class="tab-view active" id="tab-0">
        <!-- 1. Tactical Telemetry & Power Card -->
        <div class="card telemetry-card">
          <div class="tel-top">
            <div class="tel-info">
              <div class="tel-badges">
                <span class="state-tag" id="coreStateText">OFFLINE</span>
                <span class="timer-tag" id="coreTimerText">00:00:00</span>
                <button type="button" class="ping-tag" onclick="pingCurrentNode()">
                  <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                  <span id="hubPingLabel">Ping</span>
                </button>
              </div>

              <div class="exit-row" onclick="switchTab(1)">
                <span class="exit-flag" id="exitFlag">🌐</span>
                <span class="exit-ip" id="exitIpText">Not Connected</span>
                <span class="exit-country" id="exitLocText"></span>
              </div>

              <div class="speed-row">
                <div class="spd-item down">
                  <svg class="svg-ico xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
                  <strong id="rxSpeedText">0 B/s</strong>
                  <small id="rxTotalText">0 B</small>
                </div>
                <div class="spd-item up">
                  <svg class="svg-ico xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                  <strong id="txSpeedText">0 B/s</strong>
                  <small id="txTotalText">0 B</small>
                </div>
              </div>
            </div>

            <button type="button" class="power-module" id="coreBtn" onclick="toggleTunnel()">
              <svg class="svg-ico lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v10"/>
                <path d="M18.4 6.6a9 9 0 1 1-12.77.04"/>
              </svg>
              <span class="pwr-label" id="coreIcon">CONNECT</span>
            </button>
          </div>
        </div>

        <!-- 2. Precision 3-Module Switch Strip -->
        <div class="module-strip">
          <button type="button" class="mod-tile on" id="pillHotspot" onclick="toggleHotspotSetting()">
            <div class="mod-head">
              <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/></svg>
              <span class="mod-state" id="lblHotspotState">ON</span>
            </div>
            <span class="mod-name">Hotspot</span>
          </button>

          <button type="button" class="mod-tile on" id="pillApps" onclick="switchTab(2)">
            <div class="mod-head">
              <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
              <span class="mod-state" id="lblAppsState">ALL</span>
            </div>
            <span class="mod-name">App Filter</span>
          </button>

          <button type="button" class="mod-tile on" id="pillWebrtc" onclick="toggleWebrtcMode()">
            <div class="mod-head">
              <svg class="svg-ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              <span class="mod-state" id="lblWebrtcState">ON</span>
            </div>
            <span class="mod-name">WebRTC</span>
          </button>
        </div>

        <!-- 3. Endpoint Configuration Card (Auto-Persisted Silently) -->
        <div class="card endpoint-card">
          <div class="card-bar">
            <span class="card-heading" id="editingSlotTitle">SLOT P1 • SOCKS5</span>
            <div class="bar-actions">
              <button type="button" class="tool-btn" onclick="pasteUriFromClipboard()">
                <svg class="svg-ico xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                <span>Paste</span>
              </button>
              <button type="button" class="tool-btn danger" onclick="clearCurrentSlot()">
                <svg class="svg-ico xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                <span>Reset</span>
              </button>
            </div>
          </div>

          <!-- 8 Protocol Buttons -->
          <div class="proto-matrix" id="protoGrid">
            <button type="button" class="proto-chip active" data-proto="SOCKS5" onclick="setProtocol('SOCKS5')">SOCKS5</button>
            <button type="button" class="proto-chip" data-proto="HTTP" onclick="setProtocol('HTTP')">HTTP</button>
            <button type="button" class="proto-chip" data-proto="SOCKS4" onclick="setProtocol('SOCKS4')">SOCKS4</button>
            <button type="button" class="proto-chip" data-proto="SHADOWSOCKS" onclick="setProtocol('SHADOWSOCKS')">SS</button>
            <button type="button" class="proto-chip" data-proto="VLESS" onclick="setProtocol('VLESS')">VLESS</button>
            <button type="button" class="proto-chip" data-proto="VMESS" onclick="setProtocol('VMESS')">VMESS</button>
            <button type="button" class="proto-chip" data-proto="TROJAN" onclick="setProtocol('TROJAN')">TROJAN</button>
            <button type="button" class="proto-chip" data-proto="HYSTERIA2" onclick="setProtocol('HYSTERIA2')">HY2</button>
          </div>

          <!-- Server Host / IP + Port -->
          <div class="row-host-port">
            <div class="inp-group">
              <label class="inp-lbl" for="inpHost" id="lblHost">SERVER HOST / IP</label>
              <input type="text" id="inpHost" class="field-inp" placeholder="45.132.x.x or host:port:user:pass" autocomplete="off" spellcheck="false" oninput="onHostInput()" />
            </div>
            <div class="inp-group">
              <label class="inp-lbl" for="inpPort" id="lblPort">PORT</label>
              <input type="number" id="inpPort" class="field-inp" placeholder="1080" autocomplete="off" oninput="onFormEdited()" />
            </div>
          </div>

          <!-- Dynamic Credentials Grid -->
          <div class="creds-grid" id="credsGrid">
            <div class="inp-group" id="groupUser">
              <label class="inp-lbl" for="inpUser" id="lblUser">USERNAME</label>
              <input type="text" id="inpUser" class="field-inp" placeholder="Optional" autocomplete="off" spellcheck="false" oninput="onFormEdited()" />
            </div>

            <div class="inp-group hidden" id="groupCipher">
              <label class="inp-lbl" for="inpCipher">CIPHER</label>
              <input type="text" id="inpCipher" class="field-inp" placeholder="chacha20-ietf-poly1305" autocomplete="off" spellcheck="false" oninput="onFormEdited()" />
            </div>

            <div class="inp-group" id="groupPass">
              <label class="inp-lbl" for="inpPass" id="lblPass">PASSWORD</label>
              <div class="pass-box">
                <input type="password" id="inpPass" class="field-inp" placeholder="Optional" autocomplete="off" oninput="onFormEdited()" />
                <button type="button" class="eye-toggle" id="btnTogglePass" onclick="togglePasswordVisibility()" aria-label="Toggle Password">
                  <svg class="svg-ico sm" id="eyeIconSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
          </div>

          <!-- Dynamic TLS SNI -->
          <div class="inp-group hidden" id="groupSni">
            <label class="inp-lbl" for="inpSni" id="lblSni">TLS SNI</label>
            <input type="text" id="inpSni" class="field-inp" placeholder="Server Name (SNI)" autocomplete="off" spellcheck="false" oninput="onFormEdited()" />
          </div>

          <!-- Dynamic VLESS Reality -->
          <div class="row-host-port hidden" id="groupReality">
            <div class="inp-group">
              <label class="inp-lbl" for="inpExtra">REALITY PUBLIC KEY</label>
              <input type="text" id="inpExtra" class="field-inp" placeholder="pbk" autocomplete="off" spellcheck="false" oninput="onFormEdited()" />
            </div>
            <div class="inp-group">
              <label class="inp-lbl" for="inpShortId">SHORT ID</label>
              <input type="text" id="inpShortId" class="field-inp" placeholder="sid" autocomplete="off" spellcheck="false" oninput="onFormEdited()" />
            </div>
          </div>
        </div>
      </section>

      <!-- TAB 1: AUTO-RUN CHECKER (CLOSES AUTOMATICALLY ON TAB SWITCH) -->
      <section class="tab-view no-scroll" id="tab-1">
        <div class="checker-header" id="checkerToolbar">
          <button type="button" class="chk-tab active" id="presetIpFighter" onclick="loadCheckerPreset('https://ipfighter.com', 'presetIpFighter')">IPFighter</button>
          <button type="button" class="chk-tab" id="presetWebRtc" onclick="loadCheckerPreset('https://browserleaks.com/webrtc', 'presetWebRtc')">WebRTC</button>
          <button type="button" class="chk-tab" id="presetDns" onclick="loadCheckerPreset('https://browserleaks.com/dns', 'presetDns')">DNS</button>
        </div>
        <div class="checker-slot" id="checkerPlaceholder"></div>
      </section>

      <!-- TAB 2: PER-APP SPLIT TUNNEL -->
      <section class="tab-view no-scroll" id="tab-2">
        <div class="card flex-card">
          <div class="card-bar">
            <div class="bar-actions">
              <button type="button" class="tool-btn active" id="btnAllApps" onclick="setAppRouteMode(true)">All Apps</button>
              <button type="button" class="tool-btn" id="btnSelApps" onclick="setAppRouteMode(false)">Selected</button>
            </div>
            <div class="bar-actions">
              <button type="button" class="tool-btn" onclick="selectAllApps()">All</button>
              <button type="button" class="tool-btn danger" onclick="clearSelectedApps()">None</button>
            </div>
          </div>

          <input type="text" id="appSearchInput" class="field-inp" placeholder="Search apps by name or package..." autocomplete="off" oninput="renderAppsList()" />
          <div class="apps-list" id="appsListContainer"></div>
        </div>
      </section>

      <!-- TAB 3: KERNEL LOGS, AUDIT & BACKUP -->
      <section class="tab-view no-scroll" id="tab-3">
        <div class="card flex-card">
          <div class="card-bar">
            <div class="bar-actions">
              <button type="button" class="tool-btn active" id="btnModeLogs" onclick="setLogMode(false)">Logs</button>
              <button type="button" class="tool-btn" id="btnModeAudit" onclick="setLogMode(true)">Audit</button>
              <button type="button" class="tool-btn" onclick="refreshLogsNow()">Refresh</button>
              <button type="button" class="tool-btn danger" onclick="clearLogsNow()">Clear</button>
            </div>
            <div class="bar-actions">
              <button type="button" class="tool-btn" onclick="exportAllSlots()">Export</button>
              <button type="button" class="tool-btn" onclick="importAllSlots()">Import</button>
            </div>
          </div>
          <pre class="log-box" id="logConsole"></pre>
        </div>
      </section>
    </main>

    <!-- Precision SVG Bottom Navigation Dock -->
    <nav class="bottom-dock" id="bottomDock">
      <button type="button" class="dock-btn active" data-tab="0" onclick="switchTab(0)">
        <svg class="svg-ico md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span class="dock-lbl">Tunnel</span>
      </button>

      <button type="button" class="dock-btn" data-tab="1" onclick="switchTab(1)">
        <svg class="svg-ico md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
        <span class="dock-lbl">Check</span>
      </button>

      <button type="button" class="dock-btn" data-tab="2" onclick="switchTab(2)">
        <svg class="svg-ico md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
        <span class="dock-lbl">Apps</span>
      </button>

      <button type="button" class="dock-btn" data-tab="3" onclick="switchTab(3)">
        <svg class="svg-ico md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
        <span class="dock-lbl">Logs</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
