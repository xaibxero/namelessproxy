name: Build namelessproxy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download sing-box ARM64 core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L -o sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.10.7/sing-box-1.10.7-android-arm64.tar.gz
          tar -xzf sing-box.tar.gz
          cp sing-box-1.10.7-android-arm64/sing-box app/src/main/jniLibs/arm64-v8a/libsingbox.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libsingbox.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: namelessproxy-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
