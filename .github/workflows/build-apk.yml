name: Build Nameless Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Compile Pure Static sing-box Core (arm64)
        run: |
          mkdir -p app/src/main/assets
          echo "Cloning sing-box repository..."
          git clone --depth 1 https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          cd /tmp/sing-box-src
          echo "Compiling static binary for Android arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -v -trimpath -ldflags "-s -w -buildid=" ./cmd/sing-box
          mv sing-box $GITHUB_WORKSPACE/app/src/main/assets/sing-box
          cd $GITHUB_WORKSPACE
          chmod 755 app/src/main/assets/sing-box
          ls -lh app/src/main/assets/sing-box

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamelessProxy-v1.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
