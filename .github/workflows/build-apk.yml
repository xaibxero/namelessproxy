name: Build Nameless Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download and Bundle sing-box arm64 Core
        run: |
          mkdir -p app/src/main/assets
          echo "Fetching latest sing-box linux-arm64 release..."
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep "browser_download_url.*linux-arm64.tar.gz\"" | head -n 1 | cut -d '"' -f 4)
          curl -sL "$DOWNLOAD_URL" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          find . -name "sing-box" -type f -exec mv {} app/src/main/assets/sing-box \;
          chmod 755 app/src/main/assets/sing-box
          ls -lh app/src/main/assets/sing-box

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamelessProxy-v1.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
