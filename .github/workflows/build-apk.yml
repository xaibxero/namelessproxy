name: Build Nameless Proxy APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gojo_icon.png for AAPT2
        run: |
          mkdir -p app/src/main/res/drawable
          [ -f app/src/main/res/drawable/gojo_icon.png ] && \
          java -e 'import javax.imageio.ImageIO; import java.awt.image.BufferedImage; import java.awt.Graphics2D; try { var inImg = ImageIO.read(new java.io.File("app/src/main/res/drawable/gojo_icon.png")); var outImg = new BufferedImage(inImg.getWidth(), inImg.getHeight(), BufferedImage.TYPE_INT_ARGB); Graphics2D g = outImg.createGraphics(); g.drawImage(inImg, 0, 0, null); g.dispose(); ImageIO.write(outImg, "png", new java.io.File("app/src/main/res/drawable/gojo_icon.png")); } catch(Exception e){}' || true

      - name: Setup Go (Latest Stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Compile Pure Static sing-box Core (arm64 with QUIC & uTLS/REALITY)
        run: |
          mkdir -p app/src/main/assets
          echo "Cloning latest stable sing-box..."
          LATEST_TAG=$(git ls-remote --tags --refs --sort='version:refname' https://github.com/SagerNet/sing-box.git 'v*' | tail -n1 | sed 's/.*v//')
          echo "Target tag: v$LATEST_TAG"
          git clone --depth 1 --branch "v$LATEST_TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          cd /tmp/sing-box-src
          echo "Compiling static binary for Android arm64..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -v -trimpath -ldflags "-s -w -buildid=" \
            -tags "with_quic,with_utls" \
            -o /tmp/sing-box ./cmd/sing-box
          cp /tmp/sing-box $GITHUB_WORKSPACE/app/src/main/assets/sing-box
          chmod 755 $GITHUB_WORKSPACE/app/src/main/assets/sing-box

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Release & Debug APKs
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK (Smooth 120FPS Optimized)
        uses: actions/upload-artifact@v4
        with:
          name: NamelessProxy-v1.1.0-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NamelessProxy-v1.1.0-Debug
          path: app/build/outputs/apk/debug/*.apk
