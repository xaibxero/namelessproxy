name: Build Nameless Proxy APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix gojo_icon.png Format for AAPT2
        run: |
          if [ -f app/src/main/res/drawable/gojo_icon.png ]; then
            python3 -c "from PIL import Image; img = Image.open('app/src/main/res/drawable/gojo_icon.png').convert('RGBA'); img.save('app/src/main/res/drawable/gojo_icon.png', 'PNG')"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go (Latest Stable)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Compile Pure Static sing-box Core (arm64 with QUIC & uTLS/Reality)
        run: |
          mkdir -p app/src/main/assets
          echo "Cloning latest stable sing-box release..."
          LATEST_TAG=$(git ls-remote --tags --refs --sort="v:refname" https://github.com/SagerNet/sing-box.git | grep -v '\-' | tail -n1 | sed 's/.*\///')
          echo "Using sing-box tag: $LATEST_TAG"
          git clone --depth 1 --branch "$LATEST_TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          cd /tmp/sing-box-src
          echo "Compiling static binary for Android arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -v -trimpath \
            -tags "with_quic,with_utls" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$LATEST_TAG -s -w -buildid=" \
            ./cmd/sing-box
          mv sing-box "$GITHUB_WORKSPACE/app/src/main/assets/sing-box"
          cd "$GITHUB_WORKSPACE"
          chmod 755 app/src/main/assets/sing-box
          ls -lh app/src/main/assets/sing-box

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile Release & Debug APKs
        run: gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload Release APK (Smooth 120FPS Optimized)
        uses: actions/upload-artifact@v4
        with:
          name: NamelessProxy-v1.1.0-Release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NamelessProxy-v1.1.0-Debug
          path: app/build/outputs/apk/debug/*.apk
